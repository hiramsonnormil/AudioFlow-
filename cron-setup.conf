# ========================================
# CONFIGURAÇÃO DE CRON JOB - R2 CLEANUP
# ========================================

# Este arquivo contém exemplos de configuração de cron jobs
# para executar a limpeza automática de arquivos expirados no R2

# ========================================
# OPÇÃO 1: Limpeza a cada 30 minutos
# ========================================
# Executa a limpeza a cada 30 minutos
# Recomendado para uso em produção com muitos usuários

# */30 * * * * /caminho/para/AudioFlow/cleanup-r2.sh >> /var/log/phona-r2-cleanup.log 2>&1

# ========================================
# OPÇÃO 2: Limpeza a cada hora
# ========================================
# Executa a limpeza no minuto 0 de cada hora
# Suficiente se você tiver poucos usuários

# 0 * * * * /caminho/para/AudioFlow/cleanup-r2.sh >> /var/log/phona-r2-cleanup.log 2>&1

# ========================================
# OPÇÃO 3: Limpeza via curl direto
# ========================================
# Se preferir não usar o script bash, pode chamar a API diretamente

# */30 * * * * curl -X POST http://localhost:3000/api/r2-test/cleanup -H "Content-Type: application/json" -d '{"userId": "*"}' >> /var/log/phona-r2-cleanup.log 2>&1

# ========================================
# OPÇÃO 4: Limpeza customizada por horários
# ========================================
# Executa de hora em hora durante horário comercial (8h às 18h)
# E a cada 2 horas fora do horário comercial

# 0 8-18 * * * /caminho/para/AudioFlow/cleanup-r2.sh >> /var/log/phona-r2-cleanup.log 2>&1
# 0 */2 * * * /caminho/para/AudioFlow/cleanup-r2.sh >> /var/log/phona-r2-cleanup.log 2>&1

# ========================================
# COMO CONFIGURAR
# ========================================

# 1. Edite o crontab do usuário:
#    crontab -e

# 2. Adicione uma das opções acima (remova o comentário #)

# 3. Substitua os caminhos pelos caminhos reais:
#    - /caminho/para/AudioFlow → caminho real do projeto
#    - /var/log/phona-r2-cleanup.log → onde você quer os logs

# 4. Salve e saia (Ctrl+O, Enter, Ctrl+X no nano)

# 5. Verifique se foi adicionado:
#    crontab -l

# ========================================
# VERIFICAR LOGS
# ========================================

# Para ver os logs de execução:
# tail -f /var/log/phona-r2-cleanup.log

# Para ver últimas 50 linhas:
# tail -n 50 /var/log/phona-r2-cleanup.log

# Para ver erros:
# grep -i error /var/log/phona-r2-cleanup.log

# ========================================
# ROTAÇÃO DE LOGS
# ========================================

# Se quiser rotacionar logs automaticamente, crie:
# /etc/logrotate.d/phona-r2-cleanup

# Conteúdo do arquivo:
# /var/log/phona-r2-cleanup.log {
#     daily
#     rotate 7
#     compress
#     missingok
#     notifempty
# }

# ========================================
# MONITORAMENTO
# ========================================

# Para receber email quando houver problemas, adicione no crontab:
# MAILTO=seu-email@example.com

# O cron enviará email automaticamente se houver erros

# ========================================
# EXEMPLO COMPLETO
# ========================================

# Este é um exemplo completo de crontab para produção:

# SHELL=/bin/bash
# PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin
# MAILTO=admin@phona.com
#
# # Limpeza R2 a cada 30 minutos
# */30 * * * * /home/phona/AudioFlow/cleanup-r2.sh >> /var/log/phona-r2-cleanup.log 2>&1
#
# # Backup diário às 2h da manhã
# 0 2 * * * /home/phona/AudioFlow/backup-r2.sh >> /var/log/phona-r2-backup.log 2>&1

# ========================================
# TROUBLESHOOTING
# ========================================

# Problema: Cron não executa
# Solução: Verifique permissões
# chmod +x /caminho/para/AudioFlow/cleanup-r2.sh

# Problema: Script não encontra curl/jq
# Solução: Use caminhos completos no script
# /usr/bin/curl em vez de curl
# /usr/bin/jq em vez de jq

# Problema: Variáveis de ambiente não carregam
# Solução: Adicione no início do script:
# source /home/phona/AudioFlow/.env

# ========================================
# SEGURANÇA
# ========================================

# 1. Não exponha credenciais R2 nos logs
# 2. Restrinja permissões do log: chmod 600
# 3. Execute com usuário específico, não root
# 4. Monitore logs para tentativas de acesso indevido

# ========================================
# PERFORMANCE
# ========================================

# Se tiver muitos usuários (>1000), considere:
# 1. Processar em lotes (batch)
# 2. Usar fila de processamento (Redis/RabbitMQ)
# 3. Executar em horários de baixo tráfego
# 4. Implementar cache de listagens

# ========================================
# CUSTOS R2
# ========================================

# Cloudflare R2 - cota gratuita:
# - Storage: 10 GB/mês grátis
# - Class A Operations (write): 1M/mês grátis
# - Class B Operations (read): 10M/mês grátis
#
# A limpeza usa operações Class A (ListObjects, DeleteObject)
# Monitore seu uso para não ultrapassar a cota gratuita

# ========================================
# ALTERNATIVAS
# ========================================

# Em vez de cron, você pode usar:
# 1. Cloudflare Workers (execução serverless)
# 2. AWS Lambda (se migrar para S3)
# 3. Node-cron (agendamento interno no Node.js)
# 4. PM2 com cron jobs

# ========================================
# FIM DA CONFIGURAÇÃO
# ========================================
