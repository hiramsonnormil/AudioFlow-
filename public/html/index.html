<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AudioFlow - Local Audio Processor</title>
  
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="alternate icon" href="/assets/icons/favicon.svg" />
  <meta name="theme-color" content="#7B61FF" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#7B61FF" media="(prefers-color-scheme: light)" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles-landing.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <style>
    .hero { min-height: 100vh; display: flex; flex-direction: column; }
    .processor-wrapper { position: relative; z-index: 10; flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .processor-card { max-width: 800px; width: 100%; margin: 0 auto; background: var(--surface-light, rgba(255,255,255,0.05)); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); padding: 2rem; border-radius: 24px; }
  </style>
</head>

<body>
  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-bg">
      <canvas id="waveformCanvas" class="waveform-canvas"></canvas>
      <div class="hero-grain"></div>
      <div class="hero-gradient"></div>
    </div>

    <nav class="nav">
      <div class="nav-logo">
        <svg class="logo-icon" width="32" height="32" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="navGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7B61FF" />
              <stop offset="100%" stop-color="#00E0FF" />
            </linearGradient>
          </defs>
          <circle cx="22" cy="42" r="8" fill="url(#navGradient)" />
          <path d="M 29 40 L 29 18 L 42 15 L 42 17 L 30 20 L 30 38 Z" fill="url(#navGradient)" />
          <rect x="38" y="20" width="14" height="3" rx="1.5" fill="url(#navGradient)" />
          <rect x="38" y="27" width="11" height="3" rx="1.5" fill="url(#navGradient)" />
          <rect x="38" y="34" width="8" height="3" rx="1.5" fill="url(#navGradient)" />
        </svg>
        <span class="logo-text">AudioFlow Local</span>
      </div>
      <div class="nav-links">
        <a href="/html/recents.html" class="nav-link" id="nav-recents">Meus Processamentos</a>
      </div>
    </nav>

    <div class="processor-wrapper">
      <div class="processor-card">
        <div class="processor-header" style="text-align: center; margin-bottom: 2rem;">
          <h2 class="processor-title" style="font-size: 2.5rem; margin-bottom: 0.5rem;">
            Processador de <span class="text-accent">Áudio</span>
          </h2>
          <p class="processor-subtitle" style="color: var(--text-secondary);">
            Cole o link do YouTube e selecione o efeito desejado
          </p>
        </div>

        <div class="processor-grid">
          <div class="input-group">
            <label for="youtubeUrl" class="input-label">
              <span class="label-text">Link do YouTube</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke-width="2" stroke-linecap="round" />
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke-width="2" stroke-linecap="round" />
                </svg>
              </span>
              <input type="text" id="youtubeUrl" class="input-field" placeholder="https://www.youtube.com/watch?v=..." />
            </div>
          </div>

          <div class="input-group">
            <label for="presetSelect" class="input-label">
              <span class="label-text">Escolha o efeito</span>
            </label>
            <div class="select-wrapper">
              <select id="presetSelect" class="select-field">
                <option value="">Carregando presets...</option>
              </select>
              <span class="select-arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="m6 9 6 6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
            </div>
          </div>
        </div>

        <button id="processBtn" class="btn-process" style="width: 100%; margin-top: 1.5rem;">
          <span class="btn-text">✨ Processar Áudio</span>
          <span class="btn-spinner"></span>
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M5 12h14m-7-7 7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        </button>

        <div id="statusContainer" class="status-container" style="display: none; margin-top: 2rem;">
          <div class="status-content">
            <div class="status-icon"></div>
            <div class="status-info">
              <span id="statusText" class="status-text">Processando...</span>
              <span class="status-subtext">Baixando e aplicando efeitos</span>
            </div>
          </div>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </div>

        <div id="resultContainer" class="result-container" style="display: none; margin-top: 2rem;">
          <div class="result-header">
            <span class="result-badge">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              Concluído
            </span>
            <h3 class="result-title">Seu áudio está pronto</h3>
          </div>

          <div class="result-player">
            <audio id="audioPlayer" class="audio-player" controls></audio>
          </div>

          <a id="downloadBtn" class="btn-download" download>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>Download MP3</span>
          </a>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="/js/landing-animations.js"></script>
  <script type="module" src="/js/landing-processor.js"></script>
</body>
</html>
