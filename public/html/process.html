<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta
      name="description"
      content="Seu áudio está sendo processado • phona"
    />
    <title>phona • Processando</title>
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />

    <!-- Landing page styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles-landing.css" />
  </head>
  <body class="min-h-screen">
    <!-- Header -->
    <nav
      class="nav"
      style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        background: var(--bg-primary);
        border-bottom: 1px solid var(--border);
      "
    >
      <div style="max-width: 1400px; margin: 0 auto; padding: 0 2rem">
        <div class="nav-logo">
          <svg
            class="logo-icon"
            width="32"
            height="32"
            viewBox="0 0 64 64"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <linearGradient
                id="navGradient"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop offset="0%" stop-color="#C28C66" />
                <stop offset="100%" stop-color="#D4A378" />
              </linearGradient>
            </defs>
            <circle cx="22" cy="42" r="8" fill="url(#navGradient)" />
            <path
              d="M 29 40 L 29 18 L 42 15 L 42 17 L 30 20 L 30 38 Z"
              fill="url(#navGradient)"
            />
            <rect
              x="38"
              y="20"
              width="14"
              height="3"
              rx="1.5"
              fill="url(#navGradient)"
            />
            <rect
              x="38"
              y="27"
              width="11"
              height="3"
              rx="1.5"
              fill="url(#navGradient)"
            />
            <rect
              x="38"
              y="34"
              width="8"
              height="3"
              rx="1.5"
              fill="url(#navGradient)"
            />
          </svg>
          <span class="logo-text">phona</span>
        </div>
        <div class="nav-links">
          <a href="/" class="nav-link">Início</a>
          <a href="/#effects" class="nav-link">Efeitos</a>
          <a href="/#how" class="nav-link">Como funciona</a>
        </div>
      </div>
    </nav>

    <main
      style="
        padding-top: calc(80px + 1rem);
        padding-bottom: 2rem;
        min-height: 100vh;
        background: var(--bg-primary);
      "
    >
      <div style="max-width: 1200px; margin: 0 auto; padding: 0 1.5rem">
        <!-- Back link -->
        <div style="margin-bottom: 1.5rem">
          <a
            href="/"
            id="backBtn"
            style="
              display: inline-flex;
              align-items: center;
              gap: 0.5rem;
              color: var(--text-secondary);
              text-decoration: none;
              transition: color 0.3s ease;
              font-size: 0.95rem;
            "
            onmouseover="this.style.color='var(--text-primary)'"
            onmouseout="this.style.color='var(--text-secondary)'"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M19 12H5M12 19l-7-7 7-7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Voltar ao início
          </a>
        </div>

        <!-- Player Container -->
        <div
          style="
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            max-width: 900px;
            margin: 0 auto;
          "
        >
          <!-- Main Player Card -->
          <div
            class="fxproc-art"
            style="
              background: var(--bg-card);
              border: 1px solid var(--border);
              border-radius: 20px;
              padding: 2.5rem;
              box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
              position: relative;
              overflow: hidden;
            "
          >
            <!-- Status Badge -->
            <div
              style="
                position: absolute;
                top: 1.5rem;
                right: 1.5rem;
                z-index: 10;
              "
            >
              <div
                id="statusBadge"
                style="
                  padding: 0.5rem 1rem;
                  background: rgba(194, 140, 102, 0.1);
                  border: 1px solid rgba(194, 140, 102, 0.3);
                  border-radius: 999px;
                  font-size: 0.875rem;
                  font-weight: 600;
                  color: var(--copper);
                  display: flex;
                  align-items: center;
                  gap: 0.5rem;
                "
              >
                <span
                  class="status-dot"
                  style="
                    width: 8px;
                    height: 8px;
                    border-radius: 50%;
                    background: var(--copper);
                    animation: pulse 2s infinite;
                  "
                ></span>
                <span id="statusLabel">Processando</span>
              </div>
            </div>

            <div
              style="
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2.5rem;
                align-items: center;
              "
            >
              <!-- Left: Album Art -->
              <div
                style="
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  gap: 1rem;
                "
              >
                <div
                  style="
                    position: relative;
                    width: 100%;
                    max-width: 350px;
                    aspect-ratio: 1;
                  "
                >
                  <img
                    id="thumbnail"
                    alt="Capa do áudio"
                    class="loading-placeholder"
                    style="
                      width: 100%;
                      height: 100%;
                      object-fit: cover;
                      border-radius: 16px;
                      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                      transition: transform 0.3s ease;
                    "
                  />
                  <div
                    style="
                      position: absolute;
                      inset: 0;
                      border-radius: 16px;
                      background: linear-gradient(
                        135deg,
                        transparent 0%,
                        rgba(194, 140, 102, 0.05) 100%
                      );
                      pointer-events: none;
                    "
                  ></div>
                </div>
              </div>

              <!-- Right: Track Info & Controls -->
              <div style="display: flex; flex-direction: column; gap: 1.5rem">
                <!-- Track Info -->
                <div>
                  <div
                    style="
                      display: flex;
                      align-items: center;
                      gap: 0.5rem;
                      margin-bottom: 0.75rem;
                    "
                  >
                    <span
                      style="
                        font-size: 0.75rem;
                        font-weight: 700;
                        text-transform: uppercase;
                        letter-spacing: 0.1em;
                        color: var(--text-secondary);
                      "
                      >Now Playing</span
                    >
                  </div>
                  <h1
                    id="title"
                    style="
                      font-family: var(--font-display);
                      font-size: clamp(1.75rem, 3vw, 2.25rem);
                      font-weight: 700;
                      color: var(--text-primary);
                      margin-bottom: 0.5rem;
                      line-height: 1.2;
                    "
                  >
                    Processando...
                  </h1>
                  <p
                    style="
                      font-size: 1.125rem;
                      color: var(--text-secondary);
                      font-weight: 500;
                    "
                  >
                    <span id="artist">phona</span>
                  </p>
                </div>

                <!-- Progress Section -->
                <div>
                  <div
                    style="
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                      margin-bottom: 0.75rem;
                      font-size: 0.875rem;
                      font-weight: 600;
                      color: var(--text-secondary);
                    "
                  >
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                  </div>

                  <!-- Barra de PROCESSAMENTO -->
                  <div
                    id="processBar"
                    style="
                      position: relative;
                      width: 100%;
                      height: 8px;
                      background: var(--bg-secondary);
                      border-radius: 999px;
                      overflow: hidden;
                      margin-bottom: 0.35rem;
                      opacity: 1;
                      transition: opacity 0.25s ease;
                    "
                  >
                    <div
                      id="processBarInner"
                      style="
                        height: 100%;
                        width: 0%;
                        background: linear-gradient(
                          90deg,
                          var(--copper),
                          var(--copper-light)
                        );
                        transition: width 0.25s ease;
                        border-radius: 999px;
                      "
                    ></div>
                  </div>

                  <!-- Barra do PLAYER (inicialmente escondida) -->
                  <div
                    id="progressBar"
                    style="
                      position: relative;
                      width: 100%;
                      height: 8px;
                      background: var(--bg-secondary);
                      border-radius: 999px;
                      overflow: visible;
                      cursor: pointer;
                      margin-bottom: 0.5rem;
                      opacity: 0;
                      pointer-events: none;
                      transition: opacity 0.25s ease;
                    "
                  >
                    <div
                      id="playerBarInner"
                      style="
                        height: 100%;
                        width: 0%;
                        background: linear-gradient(
                          90deg,
                          var(--copper),
                          var(--copper-light)
                        );
                        transition: width 0.2s ease;
                        border-radius: 999px;
                        position: relative;
                      "
                    >
                      <div
                        id="progressThumb"
                        style="
                          position: absolute;
                          right: -6px;
                          top: 50%;
                          transform: translateY(-50%);
                          width: 14px;
                          height: 14px;
                          background: white;
                          border: 2px solid var(--copper);
                          border-radius: 50%;
                          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
                          opacity: 0;
                          transition: opacity 0.2s;
                        "
                      ></div>
                    </div>
                  </div>

                  <!-- Processing Status Text -->
                  <div style="text-align: center">
                    <p
                      id="statusText"
                      style="
                        color: var(--text-secondary);
                        font-size: 0.9rem;
                        font-weight: 500;
                      "
                    >
                      Preparando processamento...
                    </p>
                  </div>
                </div>

                <!-- Playback Controls -->
                <div
                  style="
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    gap: 1rem;
                    margin-top: 0.5rem;
                  "
                >
                  <button
                    id="shuffleBtn"
                    style="
                      width: 44px;
                      height: 44px;
                      border-radius: 50%;
                      background: transparent;
                      border: none;
                      color: var(--text-secondary);
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      transition: all 0.2s ease;
                    "
                    onmouseover="this.style.color='var(--text-primary)'; this.style.background='var(--bg-secondary)'"
                    onmouseout="this.style.color='var(--text-secondary)'; this.style.background='transparent'"
                  >
                    <svg
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </button>

                  <button
                    id="prevBtn"
                    style="
                      width: 52px;
                      height: 52px;
                      border-radius: 50%;
                      background: var(--bg-secondary);
                      border: 1px solid var(--border);
                      color: var(--text-primary);
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      transition: all 0.2s ease;
                    "
                    onmouseover="this.style.background='var(--bg-hover)'; this.style.transform='scale(1.05)'"
                    onmouseout="this.style.background='var(--bg-secondary)'; this.style.transform='scale(1)'"
                  >
                    <svg
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="currentColor"
                    >
                      <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                    </svg>
                  </button>

                  <button
                    id="playBtn"
                    style="
                      width: 64px;
                      height: 64px;
                      border-radius: 50%;
                      background: linear-gradient(
                        135deg,
                        var(--copper),
                        var(--copper-dark)
                      );
                      border: none;
                      color: white;
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      box-shadow: 0 4px 16px rgba(194, 140, 102, 0.4);
                      transition: all 0.2s ease;
                    "
                    onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0 6px 20px rgba(194, 140, 102, 0.5)'"
                    onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 4px 16px rgba(194, 140, 102, 0.4)'"
                  >
                    <svg
                      width="28"
                      height="28"
                      viewBox="0 0 24 24"
                      fill="currentColor"
                    >
                      <path d="M8 5v14l11-7z" />
                    </svg>
                  </button>

                  <button
                    id="nextBtn"
                    style="
                      width: 52px;
                      height: 52px;
                      border-radius: 50%;
                      background: var(--bg-secondary);
                      border: 1px solid var(--border);
                      color: var(--text-primary);
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      transition: all 0.2s ease;
                    "
                    onmouseover="this.style.background='var(--bg-hover)'; this.style.transform='scale(1.05)'"
                    onmouseout="this.style.background='var(--bg-secondary)'; this.style.transform='scale(1)'"
                  >
                    <svg
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="currentColor"
                    >
                      <path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z" />
                    </svg>
                  </button>

                  <button
                    id="repeatBtn"
                    style="
                      width: 44px;
                      height: 44px;
                      border-radius: 50%;
                      background: transparent;
                      border: none;
                      color: var(--text-secondary);
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      transition: all 0.2s ease;
                    "
                    onmouseover="this.style.color='var(--text-primary)'; this.style.background='var(--bg-secondary)'"
                    onmouseout="this.style.color='var(--text-secondary)'; this.style.background='transparent'"
                  >
                    <svg
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M17 1l4 4-4 4"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                      <path
                        d="M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                      <path
                        d="M21 13v2a4 4 0 0 1-4 4H3"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </button>
                </div>

                <!-- Secondary Actions -->
                <div
                  style="
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 1rem;
                    padding-top: 1rem;
                    border-top: 1px solid var(--border);
                  "
                >
                  <button
                    id="likeBtn"
                    style="
                      padding: 0.5rem 1rem;
                      border-radius: 8px;
                      background: transparent;
                      border: 1px solid var(--border);
                      color: var(--text-secondary);
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      gap: 0.5rem;
                      font-size: 0.875rem;
                      font-weight: 600;
                      transition: all 0.2s ease;
                    "
                    onmouseover="this.style.borderColor='var(--copper)'; this.style.color='var(--copper)'; this.style.background='rgba(194, 140, 102, 0.05)'"
                    onmouseout="this.style.borderColor='var(--border)'; this.style.color='var(--text-secondary)'; this.style.background='transparent'"
                  >
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                    Curtir
                  </button>

                  <a
                    id="downloadLink"
                    class="hidden"
                    download
                    style="
                      align-items: center;
                      justify-content: center;
                      gap: 0.75rem;
                      padding: 0.75rem 1.5rem;
                      background: linear-gradient(
                        135deg,
                        var(--copper),
                        var(--copper-dark)
                      );
                      color: white;
                      text-decoration: none;
                      border-radius: 8px;
                      font-weight: 600;
                      font-size: 0.9rem;
                      transition: all 0.2s ease;
                      box-shadow: 0 2px 8px rgba(194, 140, 102, 0.3);
                      display: none;
                    "
                    onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(194, 140, 102, 0.4)'"
                    onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 8px rgba(194, 140, 102, 0.3)'"
                  >
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                    <span>Download</span>
                  </a>

                  <button
                    id="shareBtn"
                    style="
                      padding: 0.5rem 1rem;
                      border-radius: 8px;
                      background: transparent;
                      border: 1px solid var(--border);
                      color: var(--text-secondary);
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      gap: 0.5rem;
                      font-size: 0.875rem;
                      font-weight: 600;
                      transition: all 0.2s ease;
                    "
                    onmouseover="this.style.borderColor='var(--copper)'; this.style.color='var(--copper)'; this.style.background='rgba(194, 140, 102, 0.05)'"
                    onmouseout="this.style.borderColor='var(--border)'; this.style.color='var(--text-secondary)'; this.style.background='transparent'"
                  >
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <circle cx="18" cy="5" r="3" />
                      <circle cx="6" cy="12" r="3" />
                      <circle cx="18" cy="19" r="3" />
                      <path
                        d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                    Compartilhar
                  </button>
                </div>
              </div>
            </div>

            <!-- Hidden Audio Element -->
            <audio id="audioPreview" style="display: none"></audio>
          </div>
        </div>

        <!-- Error Message -->
        <div
          id="errorMsg"
          class="hidden"
          style="
            display: none;
            margin-top: 1.5rem;
            padding: 1rem 1.5rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            color: #fda4af;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
          "
        ></div>
      </div>
    </main>

    <style>
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .loading-placeholder {
        background: linear-gradient(
          90deg,
          rgba(194, 140, 102, 0.1) 25%,
          rgba(194, 140, 102, 0.2) 50%,
          rgba(194, 140, 102, 0.1) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      #progressThumb {
        opacity: 0;
      }

      #progressBar:hover #progressThumb,
      #progressBar:active #progressThumb {
        opacity: 1;
      }

      /* helper classes pra fade */
      .fx-hide {
        opacity: 0 !important;
        pointer-events: none !important;
      }
      .fx-show {
        opacity: 1 !important;
        pointer-events: auto !important;
      }

      /* Responsive */
      @media (max-width: 968px) {
        main > div > div > div {
          grid-template-columns: 1fr !important;
          gap: 2rem !important;
        }

        main > div > div > div > div:first-child {
          order: 1;
        }

        main > div > div > div > div:last-child {
          order: 2;
        }
      }
    </style>

    <script>
      window.addEventListener("pageshow", () => {
        const loadingScreen = document.querySelector(".transition-loading");
        if (loadingScreen) loadingScreen.remove();
      });
    </script>

    <script src="/js/process.js?v=4"></script>
  </body>
</html>
