<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — phona</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-page">
    <!-- Background decorativo -->
    <div class="auth-bg"></div>
    
    <div class="auth-container">
      <!-- Logo -->
      <div class="auth-logo">
        <svg class="auth-logo-icon" width="40" height="40" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#c28c66" />
              <stop offset="100%" stop-color="#e8b4a0" />
            </linearGradient>
          </defs>
          <circle cx="22" cy="42" r="8" fill="url(#logoGradient)" />
          <path d="M 29 40 L 29 18 L 42 15 L 42 17 L 30 20 L 30 38 Z" fill="url(#logoGradient)" />
          <rect x="38" y="20" width="14" height="3" rx="1.5" fill="url(#logoGradient)" />
          <rect x="38" y="27" width="11" height="3" rx="1.5" fill="url(#logoGradient)" />
          <rect x="38" y="34" width="8" height="3" rx="1.5" fill="url(#logoGradient)" />
        </svg>
        <span class="auth-logo-text">phona</span>
      </div>

      <!-- Card de signup -->
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Criar sua conta</h1>
          <p class="auth-subtitle">Comece a transformar áudio gratuitamente</p>
        </div>

        <!-- Mensagens -->
        <div id="errorMessage" class="auth-error"></div>

        <!-- Form -->
        <form id="signupForm" class="auth-form">
          <div class="form-group">
            <label for="username" class="form-label">Nome de usuário</label>
            <input 
              type="text" 
              id="username" 
              name="username"
              class="form-input" 
              placeholder="seunome"
              required
              autocomplete="username"
              minlength="3"
            >
            <p class="form-hint">Mínimo 3 caracteres</p>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">E-mail</label>
            <input 
              type="email" 
              id="email" 
              name="email"
              class="form-input" 
              placeholder="seu@email.com"
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Senha</label>
            <div class="password-field">
              <input 
                type="password" 
                id="password" 
                name="password"
                class="form-input" 
                placeholder="••••••••"
                required
                autocomplete="new-password"
                minlength="8"
              >
              <button 
                type="button" 
                class="password-toggle" 
                id="togglePassword"
                aria-label="Mostrar senha"
              >
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <p class="form-hint">Mínimo 8 caracteres</p>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirmar senha</label>
            <div class="password-field">
              <input 
                type="password" 
                id="confirmPassword" 
                name="confirmPassword"
                class="form-input" 
                placeholder="••••••••"
                required
                autocomplete="new-password"
              >
              <button 
                type="button" 
                class="password-toggle" 
                id="toggleConfirmPassword"
                aria-label="Mostrar senha"
              >
                <svg id="eyeIcon2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg id="eyeOffIcon2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg auth-submit">
            <span id="btnText">Criar conta</span>
            <span id="btnSpinner" class="spinner" style="display: none;"></span>
          </button>
        </form>

        <!-- Links -->
        <div class="auth-links">
          <p class="auth-link">
            Já tem uma conta? <a href="/html/login.html">Entrar</a>
          </p>
          <p class="auth-link">
            <a href="/html/index.html">← Voltar para home</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="/js/auth/signup.js"></script>
</body>
</html>
