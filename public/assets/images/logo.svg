<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="phona logo">
  <title>phona</title>
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#00E0FF"/>
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Musical note with gradient -->
  <g filter="url(#logoGlow)">
    <!-- Note circle (bottom) -->
    <circle cx="140" cy="280" r="50" fill="url(#logoGradient)"/>
    
    <!-- Note stem -->
    <path d="M 185 275 Q 190 270, 195 265 L 195 110 Q 195 100, 205 95 L 250 85 Q 260 82, 260 95 L 260 100 L 205 112 L 205 260 Q 205 270, 195 280 L 185 275 Z" 
          fill="url(#logoGradient)"/>
    
    <!-- Sound waves (3 horizontal lines) -->
    <g opacity="0.95">
      <!-- Long line -->
      <rect x="230" y="165" width="120" height="22" rx="11" fill="url(#logoGradient)"/>
      
      <!-- Medium line -->
      <rect x="230" y="215" width="100" height="22" rx="11" fill="url(#logoGradient)" opacity="0.9"/>
      
      <!-- Short line -->
      <rect x="230" y="265" width="60" height="22" rx="11" fill="url(#logoGradient)" opacity="0.8"/>
    </g>
  </g>
</svg>
