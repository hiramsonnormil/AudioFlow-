<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta
      name="description"
      content="Seu áudio está sendo processado • phona"
    />
    <title>phona • Processando</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#7B61FF",
              secondary: "#00E0FF",
              dark: "#0A0A0A",
              "dark-lighter": "#141414",
              "dark-card": "#1A1A1A",
              "gray-text": "#A0A0A0",
            },
            borderRadius: { xl: "20px", "2xl": "30px" },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              display: ["Satoshi", "Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      @import url("https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap");
      body {
        background: #0a0a0a;
        color: #e5e5e5;
      }
      .glass-card {
        background: rgba(26, 26, 26, 0.6);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .btn-primary {
        background: linear-gradient(135deg, #7b61ff 0%, #9d7fff 100%);
        box-shadow: 0 4px 24px rgba(123, 97, 255, 0.3);
      }
    </style>

    <!-- Process page bespoke styles (vinyl, progress, etc.) -->
    <link rel="stylesheet" href="/process.css" />
  </head>
  <body class="min-h-screen">
    <!-- Header: Tailwind phona -->
    <nav
      class="fixed top-0 left-0 right-0 z-50 glass-card border-b border-white/5"
    >
      <div class="max-w-7xl mx-auto px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <a href="/" class="flex items-center gap-3 group">
            <div
              class="w-12 h-12 flex items-center justify-center rounded-2xl bg-primary/10 border border-primary/20"
            >
              <svg
                class="w-5 h-5 text-primary"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"
                />
              </svg>
            </div>
            <span class="text-xl font-semibold tracking-tight">phona</span>
          </a>
          <div class="hidden md:flex items-center gap-8">
            <a
              href="/"
              class="text-sm text-gray-text hover:text-white transition-colors"
              >Início</a
            >
            <a
              href="/#pricing"
              class="text-sm text-gray-text hover:text-white transition-colors"
              >Preços</a
            >
            <a
              href="/#how-it-works"
              class="text-sm text-gray-text hover:text-white transition-colors"
              >Como funciona</a
            >
          </div>
        </div>
      </div>
    </nav>

    <main class="pt-24 pb-16 px-6">
      <div class="max-w-4xl mx-auto">
        <!-- Back link aligned with site style; keeps original IDs for JS -->
        <div class="mb-6">
          <a
            href="/"
            id="backBtn"
            aria-label="Voltar para início"
            class="inline-flex items-center gap-2 text-gray-text hover:text-white transition-colors fxproc-btn-back"
          >
            ← Voltar
          </a>
        </div>

        <!-- Processing Card -->
        <div class="glass-card rounded-2xl p-6 md:p-8">
          <!-- Keep internal structure and IDs/classes used by process.js -->
          <div
            class="fxproc-card"
            style="
              background: transparent;
              box-shadow: none;
              border: none;
              padding: 0;
              width: 100%;
            "
          >
            <!-- Album Art -->
            <div class="fxproc-art mx-auto mb-6">
              <img
                id="thumbnail"
                alt="Capa do áudio"
                class="fxproc-thumb loading-placeholder"
                loading="lazy"
                width="50%"
                height="50%"
              />
            </div>

            <!-- Music Info -->
            <div class="fxproc-info">
              <h2 id="title" class="fxproc-title">Processando...</h2>

              <p id="statusText" class="fxproc-status">
                <span class="fxproc-status-label">Status:</span>
                <span class="fxproc-status-value">Aguardando...</span>
              </p>

              <!-- Progress Bar -->
              <div class="fxproc-bar">
                <div id="barInner" class="fxproc-bar-inner"></div>
              </div>

              <!-- Controls -->
              <div class="fxproc-controls">
                <audio
                  id="audioPreview"
                  controls
                  aria-label="Pré-visualização de áudio"
                ></audio>

                <a
                  id="downloadLink"
                  class="fxproc-btn-download hidden"
                  download
                  aria-label="Download do áudio processado"
                >
                  ⬇️ Download MP3
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- Error Message -->
        <div
          id="errorMsg"
          class="fxproc-alert fxproc-alert-error hidden mt-4"
          role="alert"
          aria-live="polite"
        ></div>
      </div>
    </main>

    <script>
      // Remover animação de transição quando página carrega (volta do back button)
      window.addEventListener("pageshow", () => {
        const loadingScreen = document.querySelector(".transition-loading");
        if (loadingScreen) loadingScreen.remove();
      });
    </script>

    <script src="/process.js"></script>
  </body>
</html>
