<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="phona icon">
  <title>phona</title>
  <defs>
    <linearGradient id="phonaGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#00E0FF"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="blur" />
    </filter>
  </defs>
  <!-- Squircle background with gradient stroke -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#0A0A0A" stroke="url(#phonaGradient)" stroke-width="2" />
  <!-- Stylized audio waveform -->
  <path d="M10 32 C 16 22, 20 42, 26 32 S 36 22, 42 32 S 52 42, 58 32" fill="none" stroke="url(#phonaGradient)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>
</svg>
