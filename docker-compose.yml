services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: phona-processor:latest
    container_name: phona-processor
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
    volumes:
      - ./storage/in:/app/storage/in
      - ./storage/out:/app/storage/out
      - ./storage/meta:/app/storage/meta
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - phona-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  phona-network:
    driver: bridge
