version: "3.8"

services:
  app:
    build: .
    container_name: phona-processor
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    volumes:
      - ./storage/in:/app/storage/in
      - ./storage/out:/app/storage/out
      - ./storage/meta:/app/storage/meta
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
